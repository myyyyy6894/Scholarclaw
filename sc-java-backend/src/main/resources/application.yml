server:
  port: 8080
  servlet:
    encoding:
      # 显式声明响应字符集：JSON 虽按 RFC 8259 默认 UTF-8，但显式声明可避免
      # 客户端与测试工具按 ISO-8859-1 解码导致中文乱码。
      charset: UTF-8
      force: true
    multipart:
      # 单文件上限 50MB（04 §4.4.2）；请求略大 1MB 以容纳 multipart 边界与表单开销。
      # 控制器仍会按 getSize() 精确校验 >50MB，见 FileUploadSecurityValidator。
      max-file-size: 50MB
      max-request-size: 51MB

spring:
  application:
    name: sc-java-backend
  # 数据源（TASK-201 起）：`02` §5.1 规定只有 sc-java-backend 连接 MySQL，Python 零连接权限。
  # 参数依据 `03` §9.1：字符集 utf8mb4、会话时区 Asia/Shanghai（不依赖 JVM 默认时区，见 ENV-01）。
  # useSSL=false + allowPublicKeyRetrieval=true：容器内网通信 + MySQL 8 默认 caching_sha2_password
  # 需要该组合；一旦对外暴露 MySQL 端口就必须改成 TLS（ENV-04 已禁止映射宿主机端口）。
  # Redis（TASK-202）：仅承载 JWT 吊销黑名单与注销阻断键（03 §8.1），不做 MySQL 二级缓存。
  data:
    redis:
      host: ${SC_REDIS_HOST:localhost}
      port: ${SC_REDIS_PORT:6379}
      password: ${SC_REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  datasource:
    url: jdbc:mysql://${SC_DB_HOST:localhost}:${SC_DB_PORT:3306}/${SC_DB_NAME:scholarclaw}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SC_DB_USER:scholarclaw}
    password: ${SC_DB_PASSWORD:}
    hikari:
      pool-name: sc-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

# MyBatis-Plus（TASK-202 首个 Mapper）：03 §4.0.2 锁定 AUTO_INCREMENT + IdType.AUTO，
# 且下划线转驼峰与表列一一对应。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sc:
  # BYOK 主密钥（TASK-203、`03` §7.3）：32 字节 Base64，仅 sc-java-backend 持有。
  # 缺失或长度不对时 AesGcmCryptoService 构造即失败（拒绝启动，避免把库写坏）。
  master-key: ${SC_MASTER_KEY:}
  # 自定义模型 Base URL 的 SSRF 白名单（`04` §4.2.2）：默认关闭本地/内网地址。
  model:
    allow-local-base-url: ${SC_ALLOW_LOCAL_MODEL_BASE_URL:false}
    allowed-origins: ${SC_LOCAL_MODEL_ALLOWED_ORIGINS:}
    probe:
      connect-timeout-millis: ${SC_MODEL_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${SC_MODEL_READ_TIMEOUT_MILLIS:10000}
  # JWT（TASK-202）：HS256 + SC_JWT_SECRET（仅 Java 容器持有）。密钥缺失或过短时启动失败（失败关闭）。
  jwt:
    secret: ${SC_JWT_SECRET:}
    ttl-seconds: ${SC_JWT_TTL_SECONDS:604800}
  # 数据库初始化与迁移基线（TASK-201、`03` §10）：有序 SQL + 版本记录表，不引入 Flyway（P0-03 决策）。
  # enabled=false 用于两类场景：① 单元测试（没有真库）；② 生产环境由运维用特权账号先手工迁移，
  # 之后应用启动时靠版本表判断"已是最新"，迁移器无需 DDL 权限。
  db:
    migration:
      enabled: ${SC_DB_MIGRATION_ENABLED:true}
      locations: classpath:db/migration
  # 共享卷根目录（TASK-403）：固定路径，Java 负责 raw/tmp 的读写与物理删除；Python 只读挂载 raw。
  # 不提供环境变量覆盖：Java 与 Python 必须看到同一目录，覆盖会造成写入/读取路径失配。
  storage:
    root: /data/scholarclaw/storage
  knowledge:
    # P4 门禁：TASK-501 的 RETRY_FAILED/REINDEX MQ 生产者落地前，手动重试/重建接口返回 501。
    manual-ingest-enabled: ${SC_MANUAL_INGEST_ENABLED:false}
    # 上传半成品与孤立文件恢复扫描（TASK-403 补偿）。
    upload-recovery:
      enabled: ${SC_UPLOAD_RECOVERY_ENABLED:true}
      stale-minutes: 10
      tmp-orphan-minutes: 60
      initial-delay-ms: 300000
      interval-ms: 900000
  # 用户时区默认值与产品基线一致（01 §FR-DDL-001）。
  # ENV-01 要求：时区必须显式固定，严禁依赖宿主机或 JVM 默认时区，
  # 因此该值由 TimeZoneConfig 在启动时显式装载，并作为 Jackson 时间序列化的基准。
  timezone: ${SC_TIMEZONE:Asia/Shanghai}
  internal:
    # Java <-> Python 内部调用鉴权令牌（02 §13.2：仅注入 sc-java-backend 与 sc-python-ai）。
    # 默认留空表示“未注入”：此时 InternalTokenAuthFilter 对所有 /internal/** 请求一律拒绝（fail-closed），
    # 真实令牌只通过环境变量注入，绝不写入仓库。
    token: ${SC_INTERNAL_SERVICE_TOKEN:}
    # sc-python-ai 内部服务基址（TASK-105 起用于健康探针；默认留空即不注册该探针，
    # 便于单机只跑 Java 时不误报 DOWN）。TASK-303 的 PythonAiEngineClient 会复用同一个基址。
    python-ai-base-url: ${SC_PYTHON_AI_BASE_URL:}
  dependencies:
    # 依赖探针的超时（毫秒）。仅用于 TCP 可达性探测。
    probe-timeout-millis: ${SC_DEPENDENCY_PROBE_TIMEOUT_MILLIS:1500}
    # 以下主机一旦注入即注册对应探针；未注入则不注册。
    # 说明：当前只做 TCP 可达性验证，连接池级探测待 TASK-201 引入 JDBC/Redis/MQ 客户端后替换。
    mysql:
      host: ${SC_DB_HOST:}
      port: ${SC_DB_PORT:3306}
      # true（默认）= 用连接池级探针（能证明凭据正确）；false = 退回 TCP 可达性。
      pool-probe: ${SC_DB_POOL_PROBE:true}
    redis:
      host: ${SC_REDIS_HOST:}
      port: ${SC_REDIS_PORT:6379}
      # true（默认）= 用连接池级探针（PING，能证明凭据正确）；false = 退回 TCP 可达性。
      pool-probe: ${SC_REDIS_POOL_PROBE:true}
    rabbitmq:
      host: ${SC_RABBITMQ_HOST:}
      port: ${SC_RABBITMQ_PORT:5672}
