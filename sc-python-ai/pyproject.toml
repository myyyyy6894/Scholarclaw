[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-python-ai"
version = "1.0.0.dev0"
description = "ScholarClaw 无状态 AI 计算引擎（Python 3.11 + FastAPI）：意图路由、DDL 提取、文档解析、Embedding、RAG 与引用校验"
requires-python = ">=3.11"

# 依赖边界说明（05 §4.6：新增依赖需说明用途，且不得留在工程里不用）：
# - fastapi / uvicorn / pydantic / httpx 为架构基线列明的运行时依赖（02 §1.3）。
# - pypdf（PDF 解析）、chromadb（向量库）、aio-pika（MQ 消费）**不在此处引入**，
#   分别随 TASK-502 / TASK-504 / TASK-502 落地，避免出现未使用依赖。
# - 未引入 pydantic-settings：配置读取只接受白名单环境变量，用标准库 + Pydantic 模型
#   即可满足，且便于机械验证"不读取 SC_MASTER_KEY / 数据库凭据"这条红线。
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
