# ============================================================================
# sc-web-nginx 站点配置（挂载到容器 /etc/nginx/conf.d/default.conf）
#
# 职责：托管 Vue 静态产物 + 反向代理 /api 与 /webhooks，
# 并**显式阻断** /internal/** —— 内部接口绝不允许从容器外部到达。
# ============================================================================

# ----------------------------------------------------------------------------
# 限流（按客户端 IP）。**必须留在 server 块外**：limit_req_zone / limit_conn_zone
# 只能声明在 http 上下文中，conf.d 里的文件正是被 include 进 http 的。
#
# 两档：
#   * sc_auth：只统计 /api/v1/auth/ 下的登录/注册/登出，防止撞库与批量注册；
#     其余请求的 key 为空串，Nginx 不计入该 zone（空 key 不参与限流）。
#   * sc_api：全量 API 的兜底速率，防止单个 IP 把服务打满。
# 共享出口 IP（校园 NAT、公司网关）会按 NAT 后的同一个 IP 计数，所以 burst
# 留得比较宽，正常使用不会触发；需要更严时直接改这里的 rate/burst。
# ----------------------------------------------------------------------------
map $uri $sc_auth_limit_key {
    default          "";
    ~^/api/v1/auth/  $binary_remote_addr;
}

limit_req_zone  $sc_auth_limit_key    zone=sc_auth:10m  rate=30r/m;
limit_req_zone  $binary_remote_addr   zone=sc_api:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr   zone=sc_conn:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限：单个课件 ≤ 50MB，留出 multipart 开销余量
    client_max_body_size 60m;

    # 限流命中返回 429，并用统一信封返回可读文案（前端按 code != OK 弹提示）
    limit_req_status  429;
    limit_conn_status 429;
    error_page 429 = @sc_too_many;

    # 还原真实客户端 IP：宿主机 Nginx / 云负载均衡转发进来时，直连对端是
    # Docker 网桥网关（172.16.0.0/12）而不是用户，不还原的话限流会把全站
    # 用户算成同一个 IP。只信任私有网段发来的 X-Forwarded-For——公网地址
    # 直连时这个头会被忽略，伪造它绕不过限流。
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # 前端产物是带哈希的静态文件，可长期缓存；index.html 不缓存以便发版即时生效
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # 内部接口一律阻断（02 §13.1 / 04 §6.1：sc-web-nginx 显式拦截 /internal/**）
    # 放在最前面并且不做任何代理，避免将来误配代理规则把内部接口暴露出去。
    # ------------------------------------------------------------------
    location /internal/ {
        return 404;
    }

    # 共享卷路径不是静态资源：显式 404，避免 SPA 回退把 /data/... 渲染成 index.html。
    location ^~ /data/ {
        return 404;
    }

    location ^~ /raw/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # 业务接口反向代理
    #
    # proxy_buffering off：SSE（API-RAG-001 流式问答）必须关闭响应缓冲，否则
    # token 会被 Nginx 攒着一起发，前端看不到"流式"效果。对普通 JSON 响应
    # 无实质代价，因此统一关闭，待 TASK-605 落地 SSE 时无需再改配置。
    #
    # 头处理：
    #   * 透传 X-Trace-Id（Java 与 Python 的链路追踪依赖它，04 §2.7.1）；
    #   * 主动清空外部伪造的 X-User-Id 与 X-Internal-Token。Java 的 TraceIdFilter
    #     本就会剥离它们（04 §6.1.2），这里是边缘层的冗余防护。
    # ------------------------------------------------------------------
    location /api/ {
        # burst 是瞬时允许的突发量：nodelay 表示突发直接放行、不排队等待。
        # 登录/注册那 30r/m 的档位只在 auth 路径生效（见文件顶部的 map）。
        limit_req  zone=sc_api  burst=40 nodelay;
        limit_req  zone=sc_auth burst=20 nodelay;
        # 单 IP 并发上限：SSE 问答是长连接，防止一个 IP 开几百条把连接数吃光。
        limit_conn sc_conn 50;

        proxy_pass http://sc-java-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         "";
        proxy_set_header X-Internal-Token  "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /webhooks/ {
        proxy_pass http://sc-java-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "";

        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # 限流命中：统一返回与后端一致的响应信封，前端可直接把 message 弹出来。
    # trace_id/timestamp 留空——这是边缘层的拒绝，没有进入业务链路。
    # ------------------------------------------------------------------
    location @sc_too_many {
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后再试。","data":null,"trace_id":"","timestamp":""}';
    }

    # ------------------------------------------------------------------
    # SPA 回退：前端路由（如后续的 /workspace）由 Vue Router 处理
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
