# ============================================================================
# sc-web-nginx 站点配置（挂载到容器 /etc/nginx/conf.d/default.conf）
#
# 职责（docs/02 §2.4 / §13.1）：托管 Vue 静态产物 + 反向代理 /api 与 /webhooks，
# 并**显式阻断** /internal/** —— 内部接口绝不允许从容器外部到达。
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限：docs/04 规定单个课件 ≤ 50MB，留出 multipart 开销余量
    client_max_body_size 60m;

    # 前端产物是带哈希的静态文件，可长期缓存；index.html 不缓存以便发版即时生效
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # 内部接口一律阻断（02 §13.1 / 04 §6.1：sc-web-nginx 显式拦截 /internal/**）
    # 放在最前面并且不做任何代理，避免将来误配代理规则把内部接口暴露出去。
    # ------------------------------------------------------------------
    location /internal/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # 业务接口反向代理
    #
    # proxy_buffering off：SSE（API-RAG-001 流式问答）必须关闭响应缓冲，否则
    # token 会被 Nginx 攒着一起发，前端看不到"流式"效果。对普通 JSON 响应
    # 无实质代价，因此统一关闭，待 TASK-605 落地 SSE 时无需再改配置。
    #
    # 头处理：
    #   * 透传 X-Trace-Id（Java 与 Python 的链路追踪依赖它，04 §2.7.1）；
    #   * 主动清空外部伪造的 X-User-Id 与 X-Internal-Token。Java 的 TraceIdFilter
    #     本就会剥离它们（04 §6.1.2），这里是边缘层的冗余防护。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://sc-java-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         "";
        proxy_set_header X-Internal-Token  "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /webhooks/ {
        proxy_pass http://sc-java-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "";

        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # SPA 回退：前端路由（如后续的 /workspace）由 Vue Router 处理
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
